name: unit

on:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest==8.3.3
      - run: mkdir -p reports && python -m pytest services --junitxml=reports/junit.xml
      # Zof reads the zof-junit artifact as unit evidence (dash platform/contracts/ci-evidence).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zof-junit
          path: reports/*.xml
